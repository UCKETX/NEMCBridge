<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · NEMCBridge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <div class="sky" aria-hidden="true"></div>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <svg class="portal" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"> <rect width="16" height="16" fill="#1a1029"/> <path fill="#2b1d45" d="M2 1h12v14H2z"/> <path fill="#120a1f" d="M3 2h10v12H3z"/> <path fill="#7c3aed" d="M4 3h8v10H4z"/> <path fill="#a855f7" d="M5 4h2v1H5zm3 1h3v1H8zM5 7h3v1H5zm4 1h2v1H9zM6 10h3v1H6zm4 1h1v1h-1z"/> <path fill="#e9d5ff" d="M6 5h1v1H6zm3 2h1v1H9zm-3 4h1v1H6z"/> <path fill="#4c2c7a" d="M2 1h1v1H2zm11 0h1v1h-1zM2 14h1v1H2zm11 0h1v1h-1z"/> </svg>
        <div><b>NEMC<span>Bridge</span></b><small>CONTROL PANEL</small></div>
      </div>
      <h1>连接世界，从这里开始</h1>
      <p class="login-sub">登录管理控制台，查看房间与服务器状态。</p>
      <form id="login-form">
        <label for="username">管理员账号
          <input id="username" name="username" value="admin" autocomplete="username" required maxlength="64">
        </label>
        <label for="password">登录密码
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="输入启动终端显示的管理员密码" autofocus>
        </label>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button id="login-submit" class="primary" type="submit">登录控制台 <span aria-hidden="true">→</span></button>
      </form>
      <p class="hint">首次启动时，管理员密码会显示在终端。忘记密码可使用 <code>-reset-admin-password</code> 重置。</p>
    </section>
    <footer>网易版 ↔&#xFE0E; 国际版 Bedrock · 在同一个世界相遇</footer>
  </main>
</body>
</html>
