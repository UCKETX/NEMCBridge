name: 功能建议
description: 提出功能或兼容性改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景、受影响的客户端版本及现有行为。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、可选方案或公开参考资料。
    validations:
      required: true
