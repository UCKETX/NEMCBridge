name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0); leave empty for build only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Validate release tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=''
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$MANUAL_TAG"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Use a release tag such as v0.1.0 or v0.1.0-rc.1' >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
                echo 'Existing tag points to a different commit; choose that ref or a new version.' >&2
                exit 1
              fi
            fi
            version="$tag"
          else
            version="dev.${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            vendor-src/nemc-tan-lobby-solver/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: SCTP wire compatibility
        run: go test github.com/Happy2018new/nemc-tan-lobby-solver/core/sctp -run 'TestChecksumWireCompatibility|TestPacketUnmarshal|TestPacketMarshal'
      - name: Build native binary
        shell: bash
        run: go build -trimpath -o smoke.exe .
      - name: Version smoke test
        shell: bash
        run: ./smoke.exe -version

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            vendor-src/nemc-tan-lobby-solver/go.sum
      - run: go mod download all
      - name: Compile
        id: compile
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          binary=NEMCBridge
          if [[ "$GOOS" == windows ]]; then binary=NEMCBridge.exe; fi
          mkdir -p build
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA" -o "build/$binary" .
          echo "binary=build/$binary" >> "$GITHUB_OUTPUT"
      - name: Package executable and licenses
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BINARY: ${{ steps.compile.outputs.binary }}
        run: python3 scripts/package_release.py --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$VERSION" --binary "$BINARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NEMCBridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, test, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NEMCBridge-*
          path: dist
          merge-multiple: true
      - name: Check package hashes and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          fi
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            notes="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "NEMCBridge $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "NEMCBridge $RELEASE_TAG" --generate-notes
            fi
          fi
